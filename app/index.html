/* Layout: phone-first app shell. Plum shield-pattern band with the white BYX logo up top; bottom tab bar on phones, top tabs on wide screens; detail opens in a side drawer. Colors and type follow the Beta Upsilon Chi brand guide (Nov 2023). */
:root{
  --purple:#4F2D7F; --plum:#371859; --iron:#2C2A26; --blue:#0388B0; --scarlet:#AC2A1C; --gold:#CCDE57;
  --bg:#F3F2F5; --panel:#FFFFFF; --panel2:#F0EEF4; --line:#E1DEE7;
  --text:#2C2A26; --muted:#6E6B66; --accent:#4F2D7F; --accent-ink:#FFFFFF; --head:#4F2D7F;
  --good:#0388B0; --warn:#AC2A1C; --bad:#AC2A1C; --info:#0388B0;
  --st-new-bg:#E6E5E4; --st-new-fg:#2C2A26;
  --st-met-bg:#D6EDF4; --st-met-fg:#02607C;
  --st-interested-bg:#E6DEF2; --st-interested-fg:#4F2D7F;
  --st-strong-bg:#4F2D7F; --st-strong-fg:#FFFFFF;
  --st-bid-bg:#CCDE57; --st-bid-fg:#2C2A26;
  --st-accepted-bg:#371859; --st-accepted-fg:#CCDE57;
  --st-dropped-bg:#F4DAD7; --st-dropped-fg:#AC2A1C;
  --display:"Saira", "Copperplate Gothic", "Trebuchet MS", sans-serif;
  --body:"Avenir Next", "Nunito Sans", "Trebuchet MS", system-ui, sans-serif;
  --mono:"Saira", "Avenir Next", system-ui, sans-serif;
  --r:12px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17121D; --panel:#211A2B; --panel2:#2B2238; --line:#3A3048;
  --text:#F2EFF6; --muted:#A7A0B2; --accent:#8F6CCB; --accent-ink:#FFFFFF; --head:#FFFFFF;
  --good:#3BB3D6; --warn:#E5746A; --bad:#E5746A; --info:#3BB3D6;
  --st-new-bg:#38343F; --st-new-fg:#E2DFE6; --st-met-bg:#0B4558; --st-met-fg:#BDE8F5;
  --st-interested-bg:#3B2C55; --st-interested-fg:#D9CBF2; --st-strong-bg:#6A45A8; --st-strong-fg:#FFFFFF;
  --st-dropped-bg:#4A2522; --st-dropped-fg:#F2B4AC;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#17121D; --panel:#211A2B; --panel2:#2B2238; --line:#3A3048;
  --text:#F2EFF6; --muted:#A7A0B2; --accent:#8F6CCB; --accent-ink:#FFFFFF; --head:#FFFFFF;
  --good:#3BB3D6; --warn:#E5746A; --bad:#E5746A; --info:#3BB3D6;
  --st-new-bg:#38343F; --st-new-fg:#E2DFE6; --st-met-bg:#0B4558; --st-met-fg:#BDE8F5;
  --st-interested-bg:#3B2C55; --st-interested-fg:#D9CBF2; --st-strong-bg:#6A45A8; --st-strong-fg:#FFFFFF;
  --st-dropped-bg:#4A2522; --st-dropped-fg:#F2B4AC;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1;text-transform:uppercase}
h2{font-size:22px;font-weight:800;color:var(--head);letter-spacing:.01em}
h3{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.09em}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700}

.shell{min-height:100%;display:flex;flex-direction:column;padding-bottom:calc(72px + env(safe-area-inset-bottom))}

  padding:calc(10px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));display:flex;align-items:center;gap:14px;
  box-shadow:inset 0 -3px 0 var(--gold)}
.top::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(55,24,89,.92) 0%,rgba(55,24,89,.6) 60%,rgba(55,24,89,.35) 100%);pointer-events:none}
.top>*{position:relative}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{height:34px;width:auto;display:block;flex:none}
.brand .bt{display:flex;flex-direction:column;min-width:0;border-left:1px solid rgba(255,255,255,.35);padding-left:12px}
.brand b{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.06em;text-transform:uppercase;line-height:1.1}
.brand small{color:rgba(255,255,255,.75);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{margin-left:auto;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.5);flex:none}
.dot.live{background:var(--gold)} .dot.slow,.dot.err{background:#ff8a7e}
.chip-me{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip-me em{font-style:normal;color:var(--gold);font-weight:700}
@media (max-width:420px){.brand img{height:28px}.brand b{font-size:15px}.brand .bt{padding-left:10px}}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--panel);border-top:1px solid var(--line);
  padding:6px max(6px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:10px;text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:600}
.tabs a svg{width:21px;height:21px}
.tabs a[aria-current="page"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
@media (min-width:820px){
  .shell{padding-bottom:0}
  .tabs{position:sticky;top:calc(57px + env(safe-area-inset-top));bottom:auto;display:flex;gap:4px;justify-content:flex-start;padding:0 16px;border-top:0;border-bottom:1px solid var(--line)}
  .tabs a{flex-direction:row;font-size:13px;padding:12px 14px;gap:7px;border-radius:0;font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-bottom:3px solid transparent}
  .tabs a svg{width:17px;height:17px}
  .tabs a[aria-current="page"]{background:none;border-bottom-color:var(--accent)}
}

main{flex:1;width:100%;max-width:1100px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left)) 28px;display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.section{display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted)} .small{font-size:13px}
.empty{color:var(--muted);font-size:14px;padding:14px;border:1px dashed var(--line);border-radius:var(--r);text-align:center}
.banner{border-radius:var(--r);padding:11px 14px;font-size:14px;background:color-mix(in srgb,var(--info) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--info) 40%,var(--line))}
.banner.bad{background:color-mix(in srgb,var(--bad) 10%,var(--panel));border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 13px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;text-decoration:none;color:var(--text)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--purple);border-color:var(--purple);color:#fff}
.btn.primary:hover{background:var(--plum);border-color:var(--plum)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--purple);border-radius:var(--r);padding:12px 14px}
.tile .num{font-size:30px;display:block;line-height:1.1;color:var(--head)}

function canSeeTies(){return !me.viewer&&(me.isOwner||isCoord());}
function knowsFor(rid){return arr(S.knows).filter(function(k){return k.rusheeId===rid;});}
function ties(rid){
  var r=S.rushees.get(rid);if(!r)return [];var out={};
  var get=function(tid){if(!S.team.get(tid))return null;return out[tid]=out[tid]||{tid:tid,lunch:0,planned:0,notes:0,texts:0,knows:false,referred:false,score:0};};
  arr(S.lunches).forEach(function(l){if((l.rusheeIds||[]).indexOf(rid)<0)return;(l.teamIds||[]).forEach(function(tid){var o=get(tid);if(!o)return;if(l.status==="done")o.lunch++;else if(l.status==="planned"&&l.reachedOut)o.planned++;});});
  arr(S.notes).forEach(function(n){if(n.rusheeId===rid&&n.teamId&&n.source!=="import"){var o=get(n.teamId);if(o)o.notes++;}});
  arr(S.reachouts).forEach(function(x){if(x.rusheeId===rid&&x.by){var o=get(x.by);if(o)o.texts++;}});
  knowsFor(rid).forEach(function(k){var o=get(k.teamId);if(o)o.knows=true;});
  var ref=norm(r.referredBy||"");if(ref)arr(S.team).forEach(function(tm){var nm=norm(tm.name);if(nm&&(ref.indexOf(nm)>=0||(nm.length>3&&nm.indexOf(ref)>=0&&ref.length>3))){var o=get(tm.id);if(o)o.referred=true;}});
  return Object.keys(out).map(function(k){var o=out[k];o.score=o.lunch*5+o.planned+o.notes*2+Math.min(o.texts,5)+(o.knows?8:0)+(o.referred?6:0);return o;})
    .filter(function(o){return o.score>0;}).sort(function(a,b){return b.score-a.score||teamName(a.tid).localeCompare(teamName(b.tid));});
}

function vcardFor(r){

  var tel=normPhone(r.phone)||String(r.phone||"");
  var note=["BYX rush",r.year,r.major,r.hometown].filter(Boolean).join(" · ");
  return ["BEGIN:VCARD","VERSION:3.0","N:"+esc3(last)+";"+esc3(first)+";;;","FN:"+esc3(r.name),"ORG:PNM",tel?"TEL;TYPE=CELL:"+tel:"","NOTE:"+esc3(note),"END:VCARD"].filter(Boolean).join("\r\n");
}
function saveContacts(rids,label){

  var text=rs.map(vcardFor).join("\r\n");var name=(rs.length===1?rs[0].name.replace(/[^a-z0-9]+/gi,"-"):"BYX-PNMs")+".vcf";
  var file;try{file=new File([text],name,{type:"text/vcard"});}catch(e){file=null;}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file]}).catch(function(){});return;}
  var url=URL.createObjectURL(new Blob([text],{type:"text/vcard;charset=utf-8"}));var a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){a.remove();URL.revokeObjectURL(url);},4000);
}

/* Plan a week */
function buildPlan(p){
  var wk=p.week;var end=addDays(wk,6);
  var bros=arr(S.team).filter(function(t){return p.bros[t.id];});
  var load={};bros.forEach(function(t){load[t.id]=0;});
  arr(S.lunches).forEach(function(l){if(l.status==="planned"&&((l.week&&weekOf(l.week)===wk)||(l.date&&l.date>=wk&&l.date<=end)))(l.teamIds||[]).forEach(function(tid){if(tid in load)load[tid]++;});});
  var cands=arr(S.rushees).filter(function(r){return ACTIVE(r)&&!hasLunch(r.id);});
  var pri={strong:0,interested:1,met:2,"new":3,bid:4};
  cands.sort(function(a,b){var la=lastLunch(a.id),lb=lastLunch(b.id);var da=la?la.date:"",dbb=lb?lb.date:"";
    return (pri[a.stage||"new"]-pri[b.stage||"new"])||da.localeCompare(dbb)||byName(a,b);});
  var cap=bros.length*p.per;var rows=[];
  cands.forEach(function(r){
    var met={};lunchesFor(r.id).forEach(function(l){(l.teamIds||[]).forEach(function(t){met[t]=1;});});
    var pick=null;
    bros.slice().sort(function(a,b){return (met[a.id]?1:0)-(met[b.id]?1:0)||(matchWhy(b,r)?1:0)-(matchWhy(a,r)?1:0)||load[a.id]-load[b.id]||byName(a,b);}).some(function(t){if(load[t.id]<p.per){pick=t.id;return true;}return false;});
    if(pick){load[pick]++;rows.push({rid:r.id,tid:pick,on:true});}
    else rows.push({rid:r.id,tid:"",on:false});
  });
  p.rows=rows;p.cap=cap;return p;
}

/* Calendar */
function vCalendar(){
  var wk=ui.calWeek||weekOf(today());var tdy=today();
  var days=[0,1,2,3,4,5,6].map(function(i){return addDays(wk,i);});
  var end=days[6];
  var all=arr(S.lunches);
  var inWeek=all.filter(function(l){return l.date&&l.date>=wk&&l.date<=end;});
  var unsched=all.filter(function(l){return !l.date&&l.status==="planned"&&l.week&&weekOf(l.week)===wk;});
  var p=function(d){var x=d.split("-");return new Date(+x[0],+x[1]-1,+x[2]);};
  var rng=p(wk).toLocaleDateString(undefined,{month:"short",day:"numeric"})+" – "+p(end).toLocaleDateString(undefined,{month:"short",day:"numeric"});
  var isThis=wk===weekOf(tdy);
  var weekEvents=arr(S.events).filter(function(e){return e.date&&e.date>=wk&&e.date<=end;});
  var h='<div class="spread"><h2>Rush calendar</h2><div class="row" style="gap:6px"><span class="seg"><a href="#calendar" aria-current="page">Week</a><a href="#lunches">List</a></span>'+(isCoord()?'<a class="btn sm primary" href="#plan">Plan a week</a>':'')+'<button class="btn sm" data-a="cal-prev" aria-label="Previous week">‹ Prev</button>'+(isThis?"":'<button class="btn sm" data-a="cal-today">This week</button>')+'<button class="btn sm" data-a="cal-next" aria-label="Next week">Next ›</button></div></div>';
  var done=inWeek.filter(function(l){return l.status==="done";}).length;
  h+='<div class="row small muted" style="justify-content:space-between"><b style="color:var(--text);font-family:var(--display);text-transform:uppercase;letter-spacing:.05em;font-size:15px">Week of '+esc(rng)+(isThis?' · This week':'')+'</b><span><span class="num">'+inWeek.filter(function(l){return l.status!=="cancelled";}).length+'</span> scheduled · <span class="num">'+done+'</span> done · <span class="num">'+unsched.length+'</span> not scheduled</span></div>';
  h+='<div class="cal">'+days.map(function(d){
    var evs=inWeek.filter(function(l){return l.date===d;}).sort(function(a,b){return (a.time||"99").localeCompare(b.time||"99");});
    var eitems=weekEvents.filter(function(e){return e.date===d;}).sort(function(a,b){return (a.time||"99").localeCompare(b.time||"99");}).map(function(e){return '<button class="ev event" data-a="open-ev" data-id="'+esc(e.id)+'"><span class="t">'+esc(fmtTime(e.time)||"Event")+' · EVENT</span><b>'+esc(e.name)+'</b><small>'+checkinsFor(e.id).length+' checked in'+(e.place?" · "+esc(e.place):"")+'</small></button>';}).join("");
    var dt=p(d);
    return '<div class="calday'+(d===tdy?" today":"")+(d<tdy?" past":"")+'"><h4>'+esc(dt.toLocaleDateString(undefined,{weekday:"short"}))+'<span>'+dt.getDate()+'</span></h4>'+
      eitems+(evs.length?evs.map(function(l){
        var rs=(l.rusheeIds||[]).map(rName).join(", ");var bs=(l.teamIds||[]).map(function(id){return teamName(id).split(" ")[0];}).join(", ");
        return '<button class="ev '+esc(l.status)+'" data-a="open-r" data-id="'+esc((l.rusheeIds||[])[0]||"")+'"><span class="t">'+esc(fmtTime(l.time)||"Time TBD")+(l.status==="done"?" · Done":"")+'</span><b>'+esc(rs)+'</b><small>with '+esc(bs||"—")+(l.place?" · "+esc(l.place):"")+'</small></button>';
      }).join(""):(eitems?"":'<div class="calnone">No lunches</div>'))+'</div>';
  }).join("")+'</div>';
  h+='<section class="section"><h3>Assigned this week, not scheduled yet</h3>';
  if(unsched.length){
    h+='<div class="list">'+unsched.sort(function(a,b){return rName((a.rusheeIds||[])[0]).localeCompare(rName((b.rusheeIds||[])[0]));}).map(function(l){
      var rs=(l.rusheeIds||[]).map(rName).join(", ");var bs=(l.teamIds||[]).map(teamName).join(", ");
      return '<button class="item" data-a="open-r" data-id="'+esc((l.rusheeIds||[])[0]||"")+'"><span class="main"><b>'+esc(rs)+'</b><small>with '+esc(bs||"no brother yet")+'</small></span><span class="side">'+(l.reachedOut?'<span class="tag">Reached out</span>':'<span class="tag" style="color:var(--warn)">Not reached out</span>')+'</span></button>';
    }).join("")+'</div>';
  } else h+='<div class="empty">'+(isThis?"Everyone assigned this week has a time on the calendar.":"No unscheduled assignments for this week.")+'</div>';
  h+='</section>';
  return h;
}

function loadRows(rows,extra){
  if(!rows.length||rows.length<2){ui.imp={msg:"I couldn't find a header row plus at least one rushee. Check the file and try again."};render();return;}
  var width=Math.max.apply(null,rows.map(function(r){return r.length;}));
  var headers=rows[0].map(function(h){return String(h==null?"":h).trim();});while(headers.length<width)headers.push("");
  ui.imp=Object.assign({headers:headers,rows:rows.slice(1),map:guessMap(headers),updateDupes:false,progress:null},extra||{});
  if(!(extra&&extra.silent))render();
}
function loadXLSX(){
  return new Promise(function(res,rej){
    if(window.XLSX)return res(window.XLSX);
    var s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload=function(){res(window.XLSX);};s.onerror=function(){rej(new Error("load"));};document.head.appendChild(s);
  });
}
function readFile(file){
  var name=file.name.toLowerCase();
  if(/\.(xlsx|xls)$/.test(name)){
    loadXLSX().then(function(X){return file.arrayBuffer().then(function(buf){
      var wb=X.read(buf,{type:"array"});ui.wb=wb;var sheet=wb.SheetNames[0];
      var W=buildWorkbook(wb.SheetNames,function(n){return X.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:"",raw:false});});
      if(W){ui.wbk=W;render();return;}
      loadRows(X.utils.sheet_to_json(wb.Sheets[sheet],{header:1,defval:"",raw:false}),{sheets:wb.SheetNames,sheet:sheet});
    });}).catch(function(){ui.imp={msg:"Couldn't read that Excel file. Try saving it as CSV and uploading that."};render();});
  } else {
    file.text().then(function(t){loadRows(parseDelimited(t));});
  }
}
function runImport(){
  var plan=importPlan();var imp=ui.imp;
  var jobs=plan.add.map(function(o){return {type:"add",o:o};});
  if(imp.overwrite)plan.dupe.forEach(function(d){var c=dupeChanges(d);if(c.length)jobs.push({type:"chg",id:d.id,c:c});});
  else if(imp.updateDupes)plan.dupe.forEach(function(d){jobs.push({type:"upd",id:d.id,o:d.o});});
  var t=myTeam();var i=0,ok=0,fail=0;
  imp.progress=0;imp.progressText="Starting…";render();
  function next(){
    if(i>=jobs.length){imp.progress=1;imp.progressText="Done: "+ok+(fail?" · "+fail+" failed":"")+".";render();toast("Done: "+ok+" rushee"+(ok===1?"":"s")+" added or updated");
      setTimeout(function(){ui.imp=null;location.hash="rushees";},900);return;}
    var j=jobs[i++];var p;
    if(j.type==="add"){var id=newId("r");var data=Object.assign({stage:"new",pointId:"",createdAt:Date.now(),createdBy:t?t.id:"",source:"import"},j.o);p=db.doc("rushees/"+id).set(data);}
    else if(j.type==="chg"){var cur2=S.rushees.get(j.id)||{};var patch2={};var ex2=null;j.c.forEach(function(c){if(c.k==="extra"){ex2=ex2||Object.assign({},cur2.extra||{});ex2[c.ek]=c.to;}else patch2[c.k]=c.to;});if(ex2)patch2.extra=ex2;p=db.doc("rushees/"+j.id).update(patch2);}
    else{var cur=S.rushees.get(j.id)||{};var patch={};Object.keys(j.o).forEach(function(k){if(k==="extra"){var ex=Object.assign({},j.o.extra,cur.extra||{});patch.extra=ex;}else if(!cur[k]&&j.o[k])patch[k]=j.o[k];});p=Object.keys(patch).length?db.doc("rushees/"+j.id).update(patch):Promise.resolve();}
    p.then(function(){ok++;},function(e){fail++;if(e&&(e.code==="quota_exceeded"||e.code==="invalid_argument")){i=jobs.length;toast(errMsg(e));}})
     .then(function(){imp.progress=i/jobs.length;imp.progressText=i+" of "+jobs.length;
       var bar=document.querySelector(".progress i");if(bar){bar.style.width=Math.round(imp.progress*100)+"%";var tx=bar.parentNode.nextElementSibling;if(tx)tx.textContent=imp.progressText;}
       setTimeout(next,40);});
  }
  next();
}

/* ---------- interaction ---------- */
var toastTimer;
function toast(msg){var el=document.querySelector(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el);}
  el.textContent=msg;el.style.display="block";clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.style.display="none";},2600);}
function armed(btn,key){
  if(confirmArm[key]&&Date.now()-confirmArm[key]<3500){delete confirmArm[key];return true;}
  confirmArm[key]=Date.now();btn.dataset.orig=btn.dataset.orig||btn.textContent;btn.textContent="Tap again to confirm";
  setTimeout(function(){if(btn.isConnected&&btn.dataset.orig)btn.textContent=btn.dataset.orig;},3500);return false;
}
function closeModal(){ui.modal=(ui.modal&&ui.modal.type==="sms"&&ui.modal.back)?ui.modal.back:null;render();}
function scheduleRender(){
  if(ui.modal){ui.pending=true;return;}
  var a=document.activeElement;
  if(a&&a.closest&&a.closest("#app")&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.type!=="file"){ui.pending=true;return;}
  render();
}
document.addEventListener("focusout",function(){setTimeout(function(){
  var a=document.activeElement;if(ui.pending&&!ui.modal&&!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)))render();},150);});

document.addEventListener("click",function(e){
  var el=e.target.closest("[data-a]");
  if(!el)return;
  if((el.classList.contains("scrim")||el.classList.contains("modalwrap"))&&e.target!==el)return;
  var a=el.dataset.a,id=el.dataset.id;

    case "go":location.hash=el.dataset.r;break;
    case "open-r":ui.drawer={id:id};render();break;

    case "claim":claim(id);break;

    case "done-l":updDoc("lunches/"+id,{status:"done",doneAt:Date.now()}).then(function(){toast("Marked done. Don't forget your note!");});break;
    case "new-t":ui.modal={type:"team"};render();focusFirst();break;

      if(el.dataset.k==="rushee"){var L=S.lunches.get(el.dataset.l);if(L&&!L.reachedOut)updDoc("lunches/"+L.id,{reachedOut:true,reachedAt:Date.now()}).catch(function(){});}})();break;

      var ok=function(){toast(el.dataset.w==="num"?"Number copied":"Message copied. Paste it into a text.");};

function mergeRushees(keepId,dupId){
  var K=S.rushees.get(keepId),D=S.rushees.get(dupId);if(!K||!D)return Promise.reject();
  var order=["new","met","interested","strong","bid","accepted"];
  var patch={};["phone","email","year","major","hometown","dorm","insta","church","referredBy","interests","photo"].forEach(function(k){if(!K[k]&&D[k])patch[k]=D[k];});
  var u=function(a,b){var o=(a||[]).slice();(b||[]).forEach(function(x){if(o.indexOf(x)<0)o.push(x);});return o;};
  patch.tags=u(K.tags,D.tags);patch.friends=u(K.friends,D.friends).filter(function(x){return x!==keepId&&x!==dupId;});
  patch.extra=Object.assign({},D.extra||{},K.extra||{});
  if(D.avoid)patch.avoid=K.avoid&&K.avoid!==D.avoid?K.avoid+"; "+D.avoid:D.avoid;
  if((D.lastReplyAt||0)>(K.lastReplyAt||0))patch.lastReplyAt=D.lastReplyAt;
  if(order.indexOf(D.stage||"new")>order.indexOf(K.stage||"new"))patch.stage=D.stage;
  var ops=[function(){return db.doc("rushees/"+keepId).update(patch);}];
  arr(S.lunches).forEach(function(l){if((l.rusheeIds||[]).indexOf(dupId)>=0)ops.push(function(){var ids=[];(l.rusheeIds||[]).forEach(function(x){var y=x===dupId?keepId:x;if(ids.indexOf(y)<0)ids.push(y);});return db.doc("lunches/"+l.id).update({rusheeIds:ids});});});
  arr(S.notes).forEach(function(n){if(n.rusheeId===dupId)ops.push(function(){return db.doc("notes/"+n.id).update({rusheeId:keepId});});});
  arr(S.reachouts).forEach(function(x){if(x.rusheeId===dupId)ops.push(function(){return db.doc("reachouts/"+x.id).update({rusheeId:keepId});});});
  arr(S.submissions).forEach(function(x){if(x.rusheeId===dupId)ops.push(function(){return db.doc("submissions/"+x.id).update({rusheeId:keepId});});});
  arr(S.checkins).forEach(function(c){if(c.rusheeId===dupId)ops.push(function(){var nk=c.eventId+"__"+keepId;return (S.checkins.has(nk)?Promise.resolve():db.doc("checkins/"+nk).set({eventId:c.eventId,rusheeId:keepId,by:c.by||"",at:c.at||Date.now(),self:!!c.self})).then(function(){return db.doc("checkins/"+c.id).delete();});});});
  arr(S.rushees).forEach(function(r){if(r.id!==keepId&&r.id!==dupId&&(r.friends||[]).indexOf(dupId)>=0)ops.push(function(){return db.doc("rushees/"+r.id).update({friends:u(r.friends.filter(function(x){return x!==dupId;}),[keepId])});});});
  ops.push(function(){return db.doc("rushees/"+dupId).delete();});
  return ops.reduce(function(p,fn){return p.then(fn);},Promise.resolve());
}

    add("Attendance",arr(S.checkins).map(function(c){var e=S.events.get(c.eventId)||{};return {Event:e.name||"",Date:e.date||"",Rushee:rName(c.rusheeId),"Checked in by":c.self?"Self (door mode)":teamName(c.by)};}));

    add("Team",arr(S.team).sort(byName).map(function(t){return {Name:t.name,Role:ROLES[t.role]||"Rush team",Phone:t.phone||""};}));
    var buf=X.write(wb,{type:"array",bookType:"xlsx"});

  }).then(function(){toast("Backup saved");},function(e){if(!(e&&e.code==="declined"))toast("Couldn't save the backup. Try again.");}).then(function(){btn.disabled=false;});

  var toData=function(id){return fetch("/_blob/"+id).then(function(r){if(!r.ok)throw new Error("photo");return r.blob();}).then(function(b){return new Promise(function(res,rej){
    var url=URL.createObjectURL(b);var img=new Image();
    img.onload=function(){var max=400,w=img.naturalWidth,h=img.naturalHeight,sc=Math.min(1,max/Math.max(w,h));var c=document.createElement("canvas");c.width=Math.round(w*sc);c.height=Math.round(h*sc);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",0.8));};
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error("photo"));};img.src=url;});});};
  var missed=0;
  var jobs=out.collections.rushees.filter(function(r){return r.photo;}).map(function(r){return toData(r.photo).then(function(d){r.photoData=d;},function(){missed++;});});
  Promise.all(jobs).then(function(){
    var counts=Object.keys(out.collections).map(function(k){return out.collections[k].length+" "+k;}).join(", ");
    return dlApi.save({filename:"BYX Rush Portal full backup "+today()+".json",data:new Blob([JSON.stringify(out)],{type:"application/json"})}).then(function(){toast("Exported "+counts+(missed?" ("+missed+" photos skipped)":""));});
  }).catch(function(e){if(!(e&&e.code==="declined"))toast("Couldn't export. Try again.");}).then(function(){btn.disabled=false;});
}
function lunchDup(x){
  return arr(S.lunches).some(function(l){if(l.status==="cancelled"||(l.rusheeIds||[]).indexOf(x.rusheeId)<0||(l.teamIds||[]).indexOf(x.by)<0)return false;
    if(l.date===x.date)return true;if(l.source==="sheet"&&l.status==="done"&&x.date&&l.week){var wk=weekOf(l.week);return x.date>=addDays(wk,-3)&&x.date<=addDays(wk,10);}return false;})||
    arr(S.submissions).some(function(y){return y.id!==x.id&&y.type==="lunch"&&y.status==="pending"&&y.by===x.by&&y.rusheeId===x.rusheeId&&y.date===x.date&&(y.createdAt||0)<(x.createdAt||0);});
}
function approveAll(btn){
  var list=pendingSubs().filter(function(x){return x.type==="lunch"&&!lunchDup(x);});
  if(!list.length){toast("Nothing to approve");return;}
  btn.disabled=true;var n=0;
  list.reduce(function(p,x){return p.then(function(){return approveSub(x.id,{disabled:false});}).then(function(){n++;btn.textContent="Approving… "+n+"/"+list.length;});},Promise.resolve())
    .then(function(){toast("Approved "+n+" lunch"+(n===1?"":"es"));},function(){toast("Stopped after "+n+". Try again.");btn.disabled=false;});
}
function approveSub(id,btn){
  var x=S.submissions.get(id);if(!x)return Promise.resolve();var me5=myTeam();btn.disabled=true;
  var finish=function(){return updDoc("submissions/"+id,{status:"approved",reviewedBy:me5?me5.id:"",reviewedAt:Date.now()}).then(function(){toast("Approved");});};
  if(x.type==="lunch"){
    var lid=newId("l");
    return setDoc("lunches/"+lid,{kind:"Lunch",date:x.date,time:x.time||"",place:x.place||"",details:"",rusheeIds:[x.rusheeId],teamIds:[x.by],status:"done",reachedOut:true,week:weekOf(x.date||today()),source:"submitted",createdAt:Date.now(),createdBy:me5?me5.id:""})
    .then(function(){return x.note?setDoc("notes/"+newId("n"),{rusheeId:x.rusheeId,teamId:x.by,uid:x.uid||null,lunchId:lid,text:x.note,rating:x.rating||null,createdAt:x.createdAt||Date.now(),source:"submitted"}):(x.rating?setDoc("notes/"+newId("n"),{rusheeId:x.rusheeId,teamId:x.by,uid:x.uid||null,lunchId:lid,text:"(Rated after a lunch logged at the start of rush.)",rating:x.rating,createdAt:x.createdAt||Date.now(),source:"submitted"}):null);})
    .then(function(){var r=S.rushees.get(x.rusheeId);if(r&&(r.stage||"new")==="new")return updDoc("rushees/"+r.id,{stage:"met"});})
    .then(finish).catch(function(){btn.disabled=false;});
  } else {
    var rid=newId("r");
    return setDoc("rushees/"+rid,{name:x.name,phone:x.phone||"",year:x.year||"",stage:"new",pointId:"",createdAt:Date.now(),createdBy:x.by,source:"suggested",extra:x.note?{"Suggested by":teamName(x.by),"How we know him":x.note}:{"Suggested by":teamName(x.by)}})
    .then(finish).catch(function(){btn.disabled=false;});
  }
}
function toggleCheckin(rid){
  if(readOnly||!ui.ev)return;var key=ui.ev+"__"+rid;var t=myTeam();
  if(S.checkins.has(key))delDoc("checkins/"+key).then(function(){toast("Unchecked");});
  else setDoc("checkins/"+key,{eventId:ui.ev,rusheeId:rid,by:t?t.id:"",at:Date.now()}).then(function(){var r=S.rushees.get(rid);toast((r?fname(r):"He")+" checked in");});
}
function uploadPhoto(rid,file){
  toast("Saving photo…");
  var finish=function(dataUrl){
    updDoc("rushees/"+rid,{photoData:dataUrl,photo:null}).then(function(){toast("Photo saved");},function(){});
  };
  var img=new Image();var url=URL.createObjectURL(file);
  img.onload=function(){var max=900,w=img.naturalWidth,h=img.naturalHeight,sc=Math.min(1,max/Math.max(w,h));
    var c=document.createElement("canvas");c.width=Math.round(w*sc);c.height=Math.round(h*sc);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    var d=c.toDataURL("image/jpeg",0.8);if(d.length>650000)d=c.toDataURL("image/jpeg",0.6);if(d.length>650000)d=c.toDataURL("image/jpeg",0.4);finish(d);};
  img.onerror=function(){URL.revokeObjectURL(url);toast("Couldn't read that photo. Try a JPG or PNG.");};
  img.src=url;
}
function runBrief(rid){
  var r=S.rushees.get(rid);if(!r||!sampleApi)return;
  ui.brief[rid]={text:"",err:""};render();
  var data={name:r.name,year:r.year,phone_on_file:!!r.phone,stage:(STAGE[r.stage||"new"]||{}).l,hometown:r.hometown,major:r.major,church:r.church,referredBy:r.referredBy,interests:r.interests,
    previousNotes:r.extra&&r.extra["Previous notes"],otherInfo:r.extra,topicsToAvoid:r.avoid||"",textsSent:pnmStatus(rid).texts,tags:r.tags||[],rushingWith:(r.friends||[]).map(rName),
    eventsAttended:eventsFor(rid).map(function(e){return e.name+" ("+e.date+")";}),
    lunches:lunchesFor(rid).sort(lunchSort).map(function(l){return {date:l.date||"not scheduled",status:l.status,with:(l.teamIds||[]).map(teamName)};}),
    teamNotes:notesFor(rid).slice(0,25).map(function(n){return {by:teamName(n.teamId),when:new Date(n.createdAt||0).toISOString().slice(0,10),rating:n.rating||null,text:n.text};})};
  var prompt="You are helping a brother in Beta Upsilon Chi (BYX), a Christian fraternity, get ready to spend time with a guy who is going through rush. Using ONLY the data below, write a short brief in plain text (no markdown headers):\n"+
    "- 3 to 5 bullets: who he is and what the team knows about him\n- One line on his interest level and anything to be aware of, citing which brother said it\n- 2 or 3 natural conversation starters based on what's known (never touching topicsToAvoid; if topicsToAvoid is set, start with a line 'Avoid: ...')\n"+
    "Keep it under 150 words. Do not invent facts; if something is unknown, leave it out. Use '•' for bullets.\n\nDATA:\n"+JSON.stringify(data);
  var out=function(){return document.getElementById("brief-out");};
  sampleApi(prompt,{modelTier:"default",onText:function(u){ui.brief[rid].text=u.text;var el=out();if(el)el.textContent=u.text;}}).then(function(res){ui.brief[rid].text=res.text;scheduleRender();})
  .catch(function(e){var m={not_granted:"Claude access wasn't allowed for this page.",rate_limited:"Too many requests right now. Try again in a bit.",sampling_disabled:"Claude isn't available on this account.",session_expired:"Sign in to Claude again, then retry."};
    ui.brief[rid].text=e&&e.text||"";ui.brief[rid].err=m[e&&e.code]||"Couldn't get a brief right now. Try again.";if(e&&(e.code==="not_granted"||e.code==="sampling_disabled"))sampleApi=null;render();});
}
function runPlan(){
  var p=ui.plan;var rows=p.rows.filter(function(r){return r.on&&r.tid;});if(!rows.length)return;
  var t=myTeam();var made=[];var i=0;p.progress=0;render();
  var next=function(){
    if(i>=rows.length){p.progress=null;var by={};made.forEach(function(l){(l.teamIds||[]).forEach(function(tid){(by[tid]=by[tid]||[]).push(l);});});
      var list=Object.keys(by).sort(function(a,b){return teamName(a).localeCompare(teamName(b));}).map(function(tid){return {tid:tid,lunches:by[tid]};});
      toast("Created "+made.length+" assignments");ui.plan=null;location.hash="calendar";ui.calWeek=p.week;ui.modal={type:"brotexts",list:list,week:p.week};render();return;}
    var row=rows[i++];var lid=newId("l");var data={kind:"Lunch",date:"",time:"",place:"",details:"",rusheeIds:[row.rid],teamIds:[row.tid],status:"planned",reachedOut:false,week:p.week,createdAt:Date.now(),createdBy:t?t.id:""};
    db.doc("lunches/"+lid).set(data).then(function(){made.push(Object.assign({id:lid},data));},function(e){toast(errMsg(e));}).then(function(){p.progress=i/rows.length;var bar=document.querySelector(".progress i");if(bar)bar.style.width=Math.round(p.progress*100)+"%";setTimeout(next,40);});

function claim(tid){
  var t=S.team.get(tid);if(!t)return;
  if(t.email&&me.email&&String(t.email).toLowerCase()!==me.email){toast("That name is linked to a different email. Ask Jonah or Clark.");return;}
  if(!isCoord()){toast("Ask Jonah or Clark to add "+me.email+" to your name on the Team tab.");return;}
  if(t.uid&&me.id&&t.uid!==me.id){toast("Someone already picked that name. Ask your coordinator to unlink it.");return;}
  ls("rh-team",tid);
  if(me.id&&t.uid!==me.id){updDoc("team/"+tid,{uid:me.id,email:me.email}).then(function(){toast("You're set, "+t.name.split(" ")[0]);render();},function(){render();});}
  else render();
}
function unclaim(){
  var t=myTeam();ls("rh-team",null);
  if(t&&me.id&&t.uid===me.id)updDoc("team/"+t.id,{uid:null}).then(render,render);else render();
}

window.addEventListener("hashchange",function(){var prev=ui.route;ui.route=(location.hash||"#me").slice(1)||"me";ui.drawer=null;if(ui.route!=="events"&&prev==="events")ui.ev=null;if(ui.route!=="plan")ui.plan=null;render();window.scrollTo(0,0);});

/* ---------- boot ---------- */
var authUI={email:false,err:""},unsubs=[];
function authErr(e){var c=e&&e.code||"";
  return {"auth/popup-closed-by-user":"Sign-in was closed before it finished.","auth/popup-blocked":"Your browser blocked the sign-in window. Try again, or use email and password.",
    "auth/wrong-password":"Wrong password.","auth/invalid-credential":"Wrong email or password.","auth/user-not-found":"No account with that email yet. Tap Create password.",
    "auth/email-already-in-use":"That email already has a password. Tap Sign in.","auth/weak-password":"Use at least 6 characters.","auth/invalid-email":"That email doesn't look right.",
    "auth/unauthorized-domain":"This web address isn't approved in Firebase yet (Authentication → Settings → Authorized domains).","auth/operation-not-allowed":"That sign-in method isn't turned on in Firebase yet.",
    "auth/network-request-failed":"No connection. Check your internet and try again."}[c]||"Couldn't sign in. Try again.";}
function signInGoogle(){authUI.err="";var p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});
  firebase.auth().signInWithPopup(p).catch(function(e){authUI.err=authErr(e);render();});}
function resetPassword(){var el=document.getElementById("si-email");var em=el&&el.value.trim();if(!em){authUI.err="Type your email first, then tap Forgot password.";render();return;}
  firebase.auth().sendPasswordResetEmail(em).then(function(){authUI.err="Check your email for a reset link.";render();},function(e){authUI.err=authErr(e);render();});}
function boot(){
  ui.route=(location.hash||"#me").slice(1)||"me";
  if(TABS.map(function(x){return x[0];}).concat(["import","lunches","plan","status","report","cards","cards-print"]).indexOf(ui.route)<0&&ui.route.indexOf("round:")!==0)ui.route="me";
  render();
  var cfg=window.BYX_FIREBASE;
  if(!window.firebase||!cfg||!cfg.apiKey||/PASTE/.test(cfg.apiKey)){status="offline";render();return;}
  firebase.initializeApp(cfg);
  var fs=firebase.firestore();
  if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(function(){});
  window.addEventListener("online",function(){render();});window.addEventListener("offline",function(){render();});
  try{fs.enablePersistence({synchronizeTabs:true}).catch(function(){});}catch(e){}
  dlApi={save:function(o){var url=URL.createObjectURL(o.data);var a=document.createElement("a");a.href=url;a.download=o.filename||"download";document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(url);a.remove();},1500);return Promise.resolve();}};
  var owners=(window.BYX_OWNERS||[]).map(function(x){return String(x).toLowerCase();});
  firebase.auth().onAuthStateChanged(function(u){
    unsubs.forEach(function(f){try{f();}catch(e){}});unsubs=[];db=null;readOnly=false;
    ["rushees","team","lunches","notes","events","checkins","reachouts","submissions"].forEach(function(n){S[n]=new Map();S.loaded[n]=false;});S.knows=new Map();S.rounds=new Map();S.sends=new Map();S.cards=new Map();S.addresses=new Map();
    if(!u){me={};status="signin";render();return;}
    if(!u.emailVerified){me={id:u.uid,email:String(u.email||"").toLowerCase()};status="verify";render();return;}
    me={id:u.uid,email:String(u.email||"").toLowerCase(),isOwner:false,canWrite:true,viewer:false,role:"",preview:null,real:null};S.viewers=null;S.viewersLoaded=false;
    me.isOwner=owners.indexOf(me.email)>=0;
    status="connecting";render();
    var timer=setTimeout(function(){if(status==="connecting"){status="slow";render();}},10000);
    var fail=function(e){clearTimeout(timer);if(e&&e.code==="permission-denied"){status="noaccess";}else status="err:"+((e&&e.code)||"unknown");render();};
    fs.doc("access/"+me.email).get().then(function(a){
      if(!a.exists&&!me.isOwner){clearTimeout(timer);status="noaccess";render();return;}
      me.role=a.exists?(a.data().role||"member"):"owner";
      me.viewer=me.role==="viewer"&&!me.isOwner;me.viewerName=a.exists?a.data().name:"";
      if(me.viewer){readOnly=true;if(ui.route==="me")ui.route="board";}
      db=fs;
      ["rushees","team","lunches","notes","events","checkins","reachouts","submissions"].forEach(function(name){
        unsubs.push(fs.collection(name).onSnapshot({includeMetadataChanges:true},function(snap){
          var m=new Map();snap.docs.forEach(function(d){m.set(d.id,Object.assign({},d.data(),{id:d.id}));});
          S[name]=m;S.loaded[name]=true;
          if((!snap.metadata.fromCache||navigator.onLine===false)&&status!=="live"&&status.indexOf("err")!==0){clearTimeout(timer);status="live";}
          if(name==="team"){var t=myTeam();if(t&&t.uid!==me.id&&String(t.email||"").toLowerCase()===me.email)fs.doc("team/"+t.id).update({uid:me.id}).catch(function(){});}
          scheduleRender();
        },fail));
      });
      var kq=(me.isOwner||me.role==="coordinator")?fs.collection("knows"):(me.role==="member"?fs.collection("knows").where("uid","==",me.id):null);
      if(kq)unsubs.push(kq.onSnapshot(function(snap){var m=new Map();snap.docs.forEach(function(d){m.set(d.id,Object.assign({},d.data(),{id:d.id}));});S.knows=m;scheduleRender();},function(){S.knows=new Map();}));
      ["rounds","sends","cards"].concat(me.viewer?[]:["addresses"]).forEach(function(name){
        unsubs.push(fs.collection(name).onSnapshot(function(snap){var m=new Map();snap.docs.forEach(function(d){m.set(d.id,Object.assign({},d.data(),{id:d.id}));});S[name]=m;S.loaded[name]=true;scheduleRender();},function(){S[name]=new Map();}));
      });
      unsubs.push(fs.doc("config/main").onSnapshot(function(s){if(s.exists)S.config=Object.assign({},S.config,s.data());scheduleRender();},fail));
    },fail);
  });
}
boot();
